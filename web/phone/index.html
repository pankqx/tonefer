<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e0d" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="no-referrer">
<title>tonefer</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/tonefer.css">
<style>
  body { overflow: hidden; }
  .app { height: 100dvh; display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(14px + env(safe-area-inset-top)) 18px 12px;
    border-bottom: 1px solid var(--line);
  }
  .scroll { flex: 1; overflow-y: auto; padding: 8px 14px 14px; overscroll-behavior: contain; }
  .card { max-width: 92%; }
  .uploads { padding: 0 16px; }
  .up { font: 12px var(--mono); color: var(--muted); margin-bottom: 8px; }
  .composer {
    display: flex; align-items: flex-end; gap: 6px;
    margin: 0 10px calc(10px + env(safe-area-inset-bottom));
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 6px;
  }
  .composer textarea {
    flex: 1; border: 0; outline: 0; resize: none; background: transparent;
    padding: 8px 4px; max-height: 140px; font-size: 16px; line-height: 1.4;
  }
  .round {
    width: 40px; height: 40px; border-radius: 50%; border: 0; flex: none;
    display: grid; place-items: center;
    background: var(--soft); color: var(--ink);
  }
  .round svg { width: 20px; height: 20px; }
  .round.send { background: var(--accent); color: var(--accent-ink); }
  .round:disabled { opacity: .35; }

  /* unpaired screen */
  .welcome {
    height: 100dvh; display: flex; flex-direction: column; justify-content: center;
    padding: 32px 28px calc(32px + env(safe-area-inset-bottom));
  }
  .welcome h1 { font-size: 34px; letter-spacing: -0.04em; line-height: 1.05; margin: 22px 0 12px; }
  .welcome p { color: var(--muted); margin: 0 0 10px; max-width: 34ch; }
  .welcome .note {
    margin-top: 26px; font: 12px/1.6 var(--mono); color: var(--muted);
    border-top: 1px solid var(--line); padding-top: 16px;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<section class="welcome" id="welcome" hidden>
  <div class="brand"><i></i>tonefer</div>
  <h1 id="wTitle">Scan the code on your laptop.</h1>
  <p id="wText">Open tonefer on your laptop and point your camera at the pairing code. You only do this once.</p>
  <div class="note">Your photos and messages are end-to-end encrypted with a key only your laptop and this phone know. Nothing leaves your local network.</div>
</section>

<div class="app" id="app" hidden>
  <header>
    <div class="brand"><i></i>tonefer</div>
    <span class="pill" id="status">connecting</span>
  </header>
  <div class="scroll" id="scroll"><div class="timeline" id="timeline"></div></div>
  <div class="uploads" id="uploads"></div>
  <form class="composer" id="composer">
    <button type="button" class="round" id="attach" aria-label="Send photos or files"></button>
    <input type="file" id="file" multiple hidden>
    <textarea id="text" rows="1" placeholder="Message to laptop"></textarea>
    <button class="round send" id="sendBtn" aria-label="Send" disabled></button>
  </form>
</div>

<div class="viewer" id="viewer">
  <div>
    <img id="viewerImg" alt="">
    <div class="bar">
      <button class="btn" id="viewerSave"></button>
      <button class="btn" id="viewerClose">Close</button>
    </div>
  </div>
</div>

<script src="/static/nacl-fast.min.js"></script>
<script src="/static/common.js"></script>
<script src="/static/phone.js"></script>
</body>
</html>
