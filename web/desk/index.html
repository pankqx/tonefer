<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tonefer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23ff5b1f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/tonefer.css">
<style>
  body { overflow: hidden; }
  .shell { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
  aside {
    border-right: 1px solid var(--line);
    padding: 26px 22px;
    display: flex; flex-direction: column; gap: 22px;
    overflow-y: auto;
  }
  aside .host { font: 12px var(--mono); color: var(--muted); margin-top: 6px; }
  .pair {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
  }
  .pair h3 { margin: 0 0 4px; font-size: 15px; }
  .pair p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
  .qr {
    background: #fff; border-radius: 10px; padding: 6px;
    aspect-ratio: 1; display: grid; place-items: center;
  }
  .qr svg { width: 100%; height: 100%; display: block; }
  .qr .none { color: #8b8881; font-size: 13px; text-align: center; padding: 20px; }
  .steps { margin: 12px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
  .steps li { margin: 3px 0; }
  .ipsel {
    width: 100%; margin-top: 10px;
    background: var(--soft); border: 1px solid var(--line); border-radius: 9px;
    padding: 7px 9px; font: 12px var(--mono); color: var(--ink);
  }
  .side-actions { display: flex; flex-direction: column; gap: 4px; margin-top: auto; }
  .side-actions .btn { text-align: left; display: flex; align-items: center; gap: 10px; }
  .danger:hover { color: #d33 !important; }

  main { display: flex; flex-direction: column; min-width: 0; position: relative; }
  .scroll { flex: 1; overflow-y: auto; padding: 26px 34px 10px; }
  .timeline { max-width: 760px; margin: 0 auto; }
  .composer {
    max-width: 760px; width: calc(100% - 68px); margin: 0 auto 22px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 8px 8px 8px 16px;
    display: flex; align-items: flex-end; gap: 6px;
    transition: border-color .15s;
  }
  .composer:focus-within { border-color: var(--muted); }
  .composer textarea {
    flex: 1; border: 0; outline: 0; resize: none; background: transparent;
    padding: 8px 0; max-height: 200px; line-height: 1.45;
  }
  .send {
    width: 38px; height: 38px; border-radius: 12px; border: 0;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center;
  }
  .send:disabled { opacity: .35; }
  .send svg { width: 18px; height: 18px; }
  .hint { text-align: center; font: 11px var(--mono); color: var(--muted); margin: -12px 0 14px; }
  .uploads { max-width: 760px; width: calc(100% - 68px); margin: 0 auto 10px; }
  .up { font: 12px var(--mono); color: var(--muted); margin-bottom: 8px; }

  .drop {
    position: absolute; inset: 14px; border-radius: 22px;
    border: 2px dashed var(--accent);
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    display: none; place-items: center;
    font-size: 20px; font-weight: 600; letter-spacing: -0.02em;
    z-index: 30; pointer-events: none;
  }
  .drop.on { display: grid; }

  @media (max-width: 820px) {
    .shell { grid-template-columns: 1fr; }
    aside { display: none; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div>
      <div class="brand"><i></i>tonefer</div>
      <div class="host" id="host"></div>
    </div>
    <span class="pill" id="status">no phone</span>

    <div class="pair" id="pair">
      <h3>Pair your phone</h3>
      <p>Scan with your phone camera. Pairing is one-time.</p>
      <div class="qr" id="qr"><div class="none">Looking for a network…</div></div>
      <select class="ipsel" id="ipsel" title="Network address the phone will use" hidden></select>
      <ol class="steps">
        <li>Turn on your phone's hotspot</li>
        <li>Connect this laptop to it</li>
        <li>Scan, then add to home screen</li>
      </ol>
    </div>

    <div class="side-actions">
      <button class="btn ghost" id="folder"></button>
      <button class="btn ghost" id="togglePair"></button>
      <button class="btn ghost danger" id="repair"></button>
      <button class="btn ghost danger" id="clear"></button>
    </div>
  </aside>

  <main id="main">
    <div class="scroll" id="scroll"><div class="timeline" id="timeline"></div></div>
    <div class="uploads" id="uploads"></div>
    <form class="composer" id="composer">
      <button type="button" class="icon-btn" id="attach" title="Send files"></button>
      <input type="file" id="file" multiple hidden>
      <textarea id="text" rows="1" placeholder="Type or paste — Enter to send"></textarea>
      <button class="send" id="sendBtn" disabled title="Send"></button>
    </form>
    <div class="hint">drop files anywhere · ctrl+v to paste images</div>
    <div class="drop" id="drop">Drop to send to phone</div>
  </main>
</div>

<div class="viewer" id="viewer">
  <div>
    <img id="viewerImg" alt="">
    <div class="bar">
      <button class="btn" id="viewerSave"></button>
      <button class="btn" id="viewerClose"></button>
    </div>
  </div>
</div>

<script src="/static/common.js"></script>
<script src="/static/desk.js"></script>
</body>
</html>
